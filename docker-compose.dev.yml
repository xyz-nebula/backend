services:
  app:
    image: ghcr.io/astral-sh/uv:alpine
    container_name: nebula-backend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_venv:/app/.venv
      - uv_cache:/root/.local/share/uv
    environment:
      - DEBUG=true
      - VALKEY_HOST=valkey
      - DB_URL=postgres://nebula:nebula@postgres:5432/nebula
      - UV_LINK_MODE=copy
      - JWT_SECRET_KEY=change-me
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - ACTIVATION_CODE_EXPIRE_MINUTES=60
      - ACTIVATION_LINK_BASE_URL=http://localhost:5173/activate?code={code}
      - MAILER_TYPE=log
    command: "sh -c 'cd /app && uv run --dev nebula-backend'"
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8
    container_name: nebula-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s

  postgres:
    image: postgres:17-alpine
    container_name: nebula-postgres
    environment:
      - POSTGRES_USER=nebula
      - POSTGRES_PASSWORD=nebula
      - POSTGRES_DB=nebula
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nebula" ]
      interval: 5s
  caddy:
    image: caddy
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_venv:
  uv_cache:
  postgres_data:
  caddy_data:
  caddy_config:

